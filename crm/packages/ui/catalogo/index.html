<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de componentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema escolhido antes da primeira pintura (sem piscar). Padrão: claro.
      try {
        var t = localStorage.getItem('portella-crm:tema');
        if (t !== 'auto') document.documentElement.dataset.tema = t === 'escuro' ? 'escuro' : 'claro';
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="./catalogo.tsx"></script>
  </body>
</html>
