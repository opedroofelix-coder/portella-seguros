<!doctype html>
<html lang="pt-BR" data-app="seguros">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1E3C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CRM de seguros da Portella Corretora de Seguros." />
    <title>Portella · CRM Seguros</title>
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema escolhido antes da primeira pintura (sem piscar). Padrão: claro.
      try {
        var t = localStorage.getItem('portella-crm:tema');
        if (t !== 'auto') document.documentElement.dataset.tema = t === 'escuro' ? 'escuro' : 'claro';
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
